the_connector:
  url: 'http://127.0.0.1:8301/v1'
  timeout: '600'
  # model: 'your-active-library-model-id'  # Otherwise discover the first active model.
openai:
  api_key: '${OPENAI_API_KEY}'
  model: 'gpt-5.6-luna'
anthropic:
  api_key: '${CLAUDE_API_KEY}'
  model: 'claude-sonnet-5'
openrouter:
  api_key: '${OPEN_ROUTER}'
  model: 'openai/gpt-4.1-mini'
  url: 'https://openrouter.ai/api/v1'
ollama:
  url: 'http://localhost:11434'
  model: 'llama3.2'
  timeout: '600'

provider:
  default: 'the_connector'
