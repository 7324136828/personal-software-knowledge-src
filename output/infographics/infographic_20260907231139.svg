<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1290" viewBox="0 0 900 1290" role="img" aria-label="Regression and the Normal Distribution">
<rect x="0" y="0" width="900" height="1290" fill="#fbfcfd"/>
<text x="450" y="50" font-size="30" font-weight="bold" fill="#1a3a5c" font-family="Segoe UI, system-ui, sans-serif" text-anchor="middle">Regression and the Normal Distribution</text>
<text x="450" y="82" font-size="15" font-weight="normal" fill="#3a6ea5" font-family="Segoe UI, system-ui, sans-serif" text-anchor="middle">A visual summary of Chapter 1 (Frees) — from Galton's heights to actuarial pricing</text>
<circle cx="40" cy="142" r="12" fill="#3a6ea5"/>
<text x="40" y="147" font-size="13" font-weight="bold" fill="#fff" font-family="Segoe UI, system-ui, sans-serif" text-anchor="middle">1</text>
<text x="60" y="148" font-size="20" font-weight="bold" fill="#1a3a5c" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">Foundations</text>
<text x="40" y="186" font-size="16" font-weight="bold" fill="#1a1a1a" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">Opening Idea</text>
<text x="40" y="206" font-size="13" font-weight="normal" fill="#333" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">Regression analysis is a statistical method used to analyze data... the distinguishing feature of this method is the ability to make</text>
<text x="40" y="223" font-size="13" font-weight="normal" fill="#333" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">statements about variables after having controlled for values of known explanatory variables.</text>
<text x="40" y="240" font-size="12" font-weight="normal" fill="#666" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">— Section 1.1</text>
<text x="40" y="298" font-size="16" font-weight="bold" fill="#1a1a1a" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">Galton's Dataset</text>
<text x="40" y="324" font-size="26" font-weight="bold" fill="#3a6ea5" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">928</text>
<text x="40" y="344" font-size="12" font-weight="normal" fill="#555" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">adult children measured in Galton's 1885 height study</text>
<text x="450.0" y="298" font-size="16" font-weight="bold" fill="#1a1a1a" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">Regression's Reach</text>
<text x="450.0" y="324" font-size="26" font-weight="bold" fill="#3a6ea5" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">24,000+</text>
<text x="450.0" y="344" font-size="12" font-weight="normal" fill="#555" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">articles using regression techniques indexed in ABI/INFORM,</text>
<text x="450.0" y="359" font-size="12" font-weight="normal" fill="#555" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">1978-2007</text>
<circle cx="40" cy="414" r="12" fill="#3a6ea5"/>
<text x="40" y="419" font-size="13" font-weight="bold" fill="#fff" font-family="Segoe UI, system-ui, sans-serif" text-anchor="middle">2</text>
<text x="60" y="420" font-size="20" font-weight="bold" fill="#1a3a5c" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">The Normal Curve</text>
<text x="40" y="458" font-size="16" font-weight="bold" fill="#1a1a1a" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">Fitting the Normal Curve</text>
<text x="40" y="480" font-size="12.5" font-weight="normal" fill="#333" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">1. Collect data (e.g. MA bodily injury claims, n=272)</text>
<text x="40" y="496" font-size="12.5" font-weight="normal" fill="#333" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">2. Compute mean, median, standard deviation, percentiles</text>
<text x="40" y="512" font-size="12.5" font-weight="normal" fill="#333" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">3. Fit normal curve using ybar for mu and s_y^2 for sigma^2</text>
<text x="40" y="528" font-size="12.5" font-weight="normal" fill="#333" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">4. Diagnose fit with histogram, box plot, and qq plot</text>
<text x="40" y="586" font-size="16" font-weight="bold" fill="#1a1a1a" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">MA Bodily Injury Claims Summary (log-thousands $)</text>
<rect x="160" y="598" width="280.0" height="10" fill="#3a6ea5"/>
<text x="40" y="608" font-size="11.5" font-weight="normal" fill="#333" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">Mean</text>
<text x="445.0342465753425" y="608" font-size="11.5" font-weight="normal" fill="#333" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">0.481</text>
<rect x="160" y="618" width="461.7" height="10" fill="#3a6ea5"/>
<text x="40" y="628" font-size="11.5" font-weight="normal" fill="#333" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">Median</text>
<text x="626.6780821917808" y="628" font-size="11.5" font-weight="normal" fill="#333" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">0.793</text>
<rect x="160" y="638" width="641.0" height="10" fill="#3a6ea5"/>
<text x="40" y="648" font-size="11.5" font-weight="normal" fill="#333" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">Std Dev</text>
<text x="805.9931506849316" y="648" font-size="11.5" font-weight="normal" fill="#333" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">1.101</text>
<rect x="160" y="658" width="66.4" height="10" fill="#3a6ea5"/>
<text x="40" y="668" font-size="11.5" font-weight="normal" fill="#333" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">25th pct</text>
<text x="231.36986301369865" y="668" font-size="11.5" font-weight="normal" fill="#333" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">-0.114</text>
<rect x="160" y="678" width="680.0" height="10" fill="#3a6ea5"/>
<text x="40" y="688" font-size="11.5" font-weight="normal" fill="#333" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">75th pct</text>
<text x="845.0" y="688" font-size="11.5" font-weight="normal" fill="#333" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">1.168</text>
<circle cx="40" cy="748" r="12" fill="#3a6ea5"/>
<text x="40" y="753" font-size="13" font-weight="bold" fill="#fff" font-family="Segoe UI, system-ui, sans-serif" text-anchor="middle">3</text>
<text x="60" y="754" font-size="20" font-weight="bold" fill="#1a3a5c" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">Power Transforms</text>
<text x="40" y="792" font-size="16" font-weight="bold" fill="#1a1a1a" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">Skewness Directions</text>
<text x="40" y="814" font-size="12.5" font-weight="normal" fill="#333" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">1. Right-skewed (positive) vs Left-skewed (negative)</text>
<text x="40" y="830" font-size="12.5" font-weight="normal" fill="#333" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">2. Long right tail, left mass vs Long left tail, right mass</text>
<text x="40" y="846" font-size="12.5" font-weight="normal" fill="#333" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">3. Typical of raw insurance claims vs Typical after log transform</text>
<text x="450.0" y="792" font-size="16" font-weight="bold" fill="#1a1a1a" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">Box-Cox Family</text>
<text x="450.0" y="814" font-size="12.5" font-weight="normal" fill="#333" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">1. lambda = 1: no transform</text>
<text x="450.0" y="830" font-size="12.5" font-weight="normal" fill="#333" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">2. lambda = 1/2: square root</text>
<text x="450.0" y="846" font-size="12.5" font-weight="normal" fill="#333" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">3. lambda = 0: natural log ln(y)</text>
<text x="450.0" y="862" font-size="12.5" font-weight="normal" fill="#333" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">4. lambda = -1: negative reciprocal</text>
<circle cx="40" cy="922" r="12" fill="#3a6ea5"/>
<text x="40" y="927" font-size="13" font-weight="bold" fill="#fff" font-family="Segoe UI, system-ui, sans-serif" text-anchor="middle">4</text>
<text x="60" y="928" font-size="20" font-weight="bold" fill="#1a3a5c" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">Sampling &amp; Design</text>
<text x="40" y="966" font-size="16" font-weight="bold" fill="#1a1a1a" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">Four Basic Sampling Assumptions</text>
<text x="40" y="988" font-size="12.5" font-weight="normal" fill="#333" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">1. E(y_i) = mu</text>
<text x="40" y="1004" font-size="12.5" font-weight="normal" fill="#333" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">2. Var(y_i) = sigma^2</text>
<text x="40" y="1020" font-size="12.5" font-weight="normal" fill="#333" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">3. {y_i} independent</text>
<text x="40" y="1036" font-size="12.5" font-weight="normal" fill="#333" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">4. {y_i} normally distributed</text>
<text x="450.0" y="966" font-size="16" font-weight="bold" fill="#1a1a1a" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">Designed vs Observational Data</text>
<text x="450.0" y="988" font-size="12.5" font-weight="normal" fill="#333" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">1. RAND Health Insurance Experiment vs Galton height data</text>
<text x="450.0" y="1004" font-size="12.5" font-weight="normal" fill="#333" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">2. Analyst controls treatment vs Analyst cannot control</text>
<text x="450.0" y="1020" font-size="12.5" font-weight="normal" fill="#333" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">    assignment</text>
<text x="450.0" y="1036" font-size="12.5" font-weight="normal" fill="#333" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">3. Causal inference possible vs Statistical control only,</text>
<text x="450.0" y="1052" font-size="12.5" font-weight="normal" fill="#333" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">    confounders possible</text>
<circle cx="40" cy="1112" r="12" fill="#3a6ea5"/>
<text x="40" y="1117" font-size="13" font-weight="bold" fill="#fff" font-family="Segoe UI, system-ui, sans-serif" text-anchor="middle">5</text>
<text x="60" y="1118" font-size="20" font-weight="bold" fill="#1a3a5c" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">Actuarial Applications</text>
<text x="40" y="1156" font-size="16" font-weight="bold" fill="#1a1a1a" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">Three Traditional Actuarial Applications</text>
<text x="40" y="1178" font-size="12.5" font-weight="normal" fill="#333" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">1. Pricing — risk classification counters adverse selection</text>
<text x="40" y="1194" font-size="12.5" font-weight="normal" fill="#333" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">2. Reserving — forecasting future obligations</text>
<text x="40" y="1210" font-size="12.5" font-weight="normal" fill="#333" font-family="Segoe UI, system-ui, sans-serif" text-anchor="start">3. Solvency testing — assessing capital adequacy</text>
</svg>
