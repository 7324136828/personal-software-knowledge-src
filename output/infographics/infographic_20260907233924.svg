<svg xmlns="http://www.w3.org/2000/svg" width="900" height="793" viewBox="0 0 900 793" role="img" aria-label="Basic Linear Regression infographic"><rect width="900" height="793" fill="#fbfcfe"/><text x="45" y="28" font-family="Segoe UI, system-ui, sans-serif" font-size="27" font-weight="bold" fill="#173b59">Basic Linear Regression</text><text x="45" y="45" font-size="19" font-weight="bold" fill="#2369a6">Foundation</text><text x="55" y="71" font-size="15" font-weight="bold">Regression’s question</text><text x="65" y="89" font-size="12">If we change the level of x, what will happen to the level of y?</text><text x="45" y="117" font-size="19" font-weight="bold" fill="#2369a6">Foundation</text><text x="55" y="143" font-size="15" font-weight="bold">Lottery sample</text><text x="65" y="161" font-size="12">50</text><text x="45" y="189" font-size="19" font-weight="bold" fill="#2369a6">Foundation</text><text x="55" y="215" font-size="15" font-weight="bold">POP–SALES correlation</text><text x="65" y="233" font-size="12">0.886</text><text x="45" y="261" font-size="19" font-weight="bold" fill="#2369a6">Least Squares</text><text x="55" y="287" font-size="15" font-weight="bold">Fit a least-squares line</text><text x="65" y="305" font-size="12">Start with y=b0*+b1*x · Compute squared deviations from candidate line · Sum all squared</text><text x="65" y="321" font-size="12">deviations · Choose b0 and b1 that minimize the sum</text><text x="45" y="349" font-size="19" font-weight="bold" fill="#2369a6">Least Squares</text><text x="55" y="375" font-size="15" font-weight="bold">Wisconsin Lottery ANOVA</text><text x="65" y="393" font-size="12">Regression SS: 2527165015 · Error SS: 690116755 · Total SS: 3217281770</text><text x="45" y="421" font-size="19" font-weight="bold" fill="#2369a6">Inference &amp; Diagnostics</text><text x="55" y="447" font-size="15" font-weight="bold">Two kinds of uncertainty</text><text x="65" y="465" font-size="12">Confidence interval vs Prediction interval · Uncertainty about beta1 vs Uncertainty for a new y at</text><text x="65" y="481" font-size="12">x* · Lottery 95% slope: 0.549 to 0.745 vs 95% POP=10,000: 0 to 14,641 after truncation</text><text x="45" y="509" font-size="19" font-weight="bold" fill="#2369a6">Inference &amp; Diagnostics</text><text x="55" y="535" font-size="15" font-weight="bold">Residual-analysis checklist</text><text x="65" y="553" font-size="12">Check independence · Check constant variability · Check error–predictor patterns · Check normality</text><text x="65" y="569" font-size="12">and unusual points</text><text x="45" y="597" font-size="19" font-weight="bold" fill="#2369a6">Inference &amp; Diagnostics</text><text x="55" y="623" font-size="15" font-weight="bold">Unusual observations</text><text x="65" y="641" font-size="12">Outlier vs High leverage point · Vertically unusual y vs Horizontally unusual x · Kenosha changes</text><text x="65" y="657" font-size="12">fit measures vs Can also reveal a real substantive mechanism</text><text x="45" y="685" font-size="19" font-weight="bold" fill="#2369a6">Financial Application</text><text x="55" y="711" font-size="15" font-weight="bold">CAPM: Lincoln on MARKET</text><text x="65" y="729" font-size="12">Fit: Lincolnhat=-0.00214+0.973 MARKET · Market relationship statistically important: t=5.64 ·</text><text x="65" y="745" font-size="12">Market explains a partial share: R²=35.4% · Slope above 1 = aggressive; below 1 = defensive</text></svg>
