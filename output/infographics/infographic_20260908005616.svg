<svg xmlns="http://www.w3.org/2000/svg" width="900" height="784" viewBox="0 0 900 784"><rect width="100%" height="100%" fill="#e6f2f0"/><g font-family="Segoe UI, system-ui, sans-serif" fill="#14243b"><text x="45" y="42" font-size="30" font-weight="700">Multiple Linear Regression II</text><text x="45" y="70" font-size="16">Categorical predictors, joint F tests, ANOVA, and interactions</text><rect x="45" y="100" width="810" height="96" rx="14" fill="#fff"/><text x="65" y="130" font-size="20" font-weight="700">1. Model a categorical predictor</text><text x="65" y="162" font-size="15">Identify factor levels • Choose a reference level • Create c-1 indicators • Interpret coefficients r</text><rect x="45" y="214" width="810" height="96" rx="14" fill="#fff"/><text x="65" y="244" font-size="20" font-weight="700">2. Term-life joint test</text><text x="65" y="276" font-size="15">F = 3.235</text><rect x="45" y="328" width="810" height="96" rx="14" fill="#fff"/><text x="65" y="358" font-size="20" font-weight="700">3. Partial F workflow</text><text x="65" y="390" font-size="15">Fit the full model • Fit the nested reduced model • Compute extra error SS per restriction • Compare</text><rect x="45" y="442" width="810" height="96" rx="14" fill="#fff"/><text x="65" y="472" font-size="20" font-weight="700">4. One-factor ANOVA and regression</text><text x="65" y="504" font-size="15">ANOVA: one mean per group • Regression: binary-variable representation • Both: least squares and sha</text><rect x="45" y="556" width="810" height="96" rx="14" fill="#fff"/><text x="65" y="586" font-size="20" font-weight="700">5. Auto-claims ANOVA sums of squares</text><text x="65" y="618" font-size="15">Factor SS: 39.2 • Error SS: 7729.0 • Total SS: 7768.2</text><rect x="45" y="670" width="810" height="96" rx="14" fill="#fff"/><text x="65" y="700" font-size="20" font-weight="700">6. Modeling lesson</text><text x="65" y="732" font-size="15">A pooled relationship can be misleading when an omitted categorical variable structures the data.</text></g></svg>
